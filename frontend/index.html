<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Site Viewer — 3D Digital Twin</title>
    
    <!-- Google Fonts: Archivo, Reddit Sans, Source Code Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Reddit+Sans:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

    <!-- Tailwind CSS with Site Viewer Studio Design System -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">

      globalThis.tailwind.config = {

        theme: {
          extend: {
            colors: {
              'success': '#2E6F40',

              'light-primary-container': '#CE4621',

              'light-secondary': '#33628B',
              'light-on-secondary': '#FFFFFF',
              'light-secondary-container': '#E8F1FF',
              'light-on-secondary-container': '#154A72',
              'light-tertiary': '#006191',
              'light-on-tertiary': '#FFFFFF',
              'light-error': '#BA1A1A',
              'light-on-error': '#FFFFFF',
              'light-error-container': '#FFDAD6',
              'light-error-text': '#93000A',
              'light-background': '#FEF9F0',
              'light-on-background': '#1D1C16',
              'light-surface': '#FEF9F0',
              'light-surface-dim': '#DED9D1',
              'light-surface-bright': '#FFFFFF',
              'light-surface-container-lowest': '#FFFFFF',

              'light-surface-container-highest': '#E7E2D9',

              'light-on-surface-variant': '#615E58',
              'light-outline': '#7A7770',
              'light-outline-variant': '#CAC6BE',
              'light-inverse-surface': '#32302B',
              'light-inverse-on-surface': '#F5F0E7',
              'dark-primary': '#F4613A',
              'dark-on-primary': '#2A0400',
              'dark-primary-container': '#AF300A',
              'dark-on-primary-container': '#FFEDE9',
              'dark-secondary': '#82AFDD',
              'dark-on-secondary': '#001D33',
              'dark-secondary-container': '#154A72',

              'md': '6px',
              'lg': '8px',

            spacing: {

              'gutter-xl': '24px',
              'section': '32px',
              'page-margin': '24px',

            fontFamily: {
              'display': ['"Archivo"', 'sans-serif'],
              'headline': ['"Archivo"', 'sans-serif'],
              'title': ['"Archivo"', 'sans-serif'],
              'body': ['"Reddit Sans"', 'sans-serif'],
              'label': ['"Reddit Sans"', 'sans-serif'],
              'mono': ['"Source Code Pro"', 'monospace'],
            },
            fontSize: {
              'display-md': ['36px', { lineHeight: '44px', letterSpacing: '-0.75px', fontWeight: '600' }],
              'display-md-mobile': ['28px', { lineHeight: '36px', letterSpacing: '-0.5px', fontWeight: '600' }],
              'headline-lg': ['24px', { lineHeight: '30px', letterSpacing: '-0.3px', fontWeight: '600' }],

              'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.4px', fontWeight: '600' }],
              'mono-sm': ['12px', { lineHeight: '16px', letterSpacing: '0px', fontWeight: '500' }],
            },
            transitionDuration: {
              'state-change': '120ms',
              'panel-transition': '180ms',
            },
            transitionTimingFunction: {
              'state-change': 'ease-out',
              'panel-transition': 'cubic-bezier(0.2, 0, 0, 1)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-light-surface dark:bg-dark-surface text-light-on-surface dark:text-dark-on-surface font-body antialiased transition-colors duration-state-change ease-state-change">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
